<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TDL Conversion</title>

    <!-- Water.css -->
    <link id="water-theme"
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">

    <link rel="stylesheet" href="style.css">

    <script src="saxonjs3/SaxonJS3.rt.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

<header class="site-header">

    <div class="header-left">
        <a href="https://ardoid.eu">← ardoid.eu</a>
    </div>

    <div class="header-center">
        <h1>
            <img src="logo.svg"
                 alt="TDL Logo"
                 class="logo">
            TDL Conversion
        </h1>
    </div>

    <div class="header-right">
        <button id="theme-toggle">🌙</button>
        <a href="legal-notice.html">Legal Notice</a>
        <a href="contact.html">Contact</a>
    </div>

</header>

<main>

    <div class="toolbar">
        <button id="btn-html">
            TDL2HTML
        </button>

        <button id="btn-md">
            TDL2MD
        </button>

        <input
            type="file"
            id="fileInput"
            accept=".tdl,.xml">
    </div>

    <div id="dropZone">
        Drag & Drop TDL File Here
    </div>

    <section class="workspace">

        <div class="panel">

            <h3>Input</h3>

            <textarea
                id="inputText"
                spellcheck="false"></textarea>

        </div>

        <div class="panel output-panel">

            <div class="panel-header">

                <h3>Output</h3>

                <div class="view-switch" role="radiogroup" aria-label="Output view">
                    <label>
                        <input type="radio" name="outputView" value="source" checked>
                        Source
                    </label>
                    <label>
                        <input type="radio" name="outputView" value="preview">
                        Preview
                    </label>
                </div>

            </div>

            <pre id="outputSource" class="output-view source-view"></pre>

            <div id="outputPreview" class="output-view preview-view hidden"></div>

        </div>

    </section>

</main>

</body>
</html>
